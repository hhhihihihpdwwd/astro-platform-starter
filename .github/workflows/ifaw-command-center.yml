name: IFAW Command Center - Quellen aktualisieren
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'command-center/scripts/collect.py'
      - 'command-center/scripts/study_daily.py'
      - 'command-center/scripts/enrich_studies.py'
      - '.github/workflows/ifaw-command-center.yml'
  schedule:
    - cron: '11,41 * * * *'
permissions:
  contents: write
concurrency:
  group: ifaw-command-center-news
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Öffentliche Nachrichten und Originalstudien abrufen
        run: |
          python command-center/scripts/collect.py
          python command-center/scripts/study_daily.py
          python command-center/scripts/enrich_studies.py
      - name: Öffentliche Metadaten aktualisieren
        run: |
          if ! git diff --quiet -- command-center/data/articles.json command-center/data/daily_study.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add command-center/data/articles.json command-center/data/daily_study.json
            git commit -m 'chore: refresh original wildlife news and DOI study abstracts [skip ci]'
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main || { git rebase --abort; exit 1; }
              if git push origin HEAD:main; then break; fi
              if [ "$attempt" -eq 3 ]; then exit 1; fi
              sleep 2
            done
          fi
