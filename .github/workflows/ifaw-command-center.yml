name: IFAW Command Center - Quellen aktualisieren
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'command-center/scripts/collect.py'
      - '.github/workflows/ifaw-command-center.yml'
  schedule:
    - cron: '13 */6 * * *'
permissions:
  contents: write
concurrency:
  group: ifaw-command-center-news
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Öffentliche Quellen abrufen
        run: python command-center/scripts/collect.py
      - name: Datensatz aktualisieren ohne andere Änderungen zu überschreiben
        run: |
          if ! git diff --quiet -- command-center/data/articles.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add command-center/data/articles.json
            git commit -m 'chore: refresh public wildlife news metadata [skip ci]'
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main || { git rebase --abort; exit 1; }
              if git push origin HEAD:main; then break; fi
              if [ "$attempt" -eq 3 ]; then exit 1; fi
              sleep 2
            done
          fi
