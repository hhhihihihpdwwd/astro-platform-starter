name: IFAW Command Center - Quellen aktualisieren
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'command-center/scripts/collect.py'
      - 'command-center/scripts/study_daily.py'
      - 'command-center/scripts/translate_articles.py'
      - '.github/workflows/ifaw-command-center.yml'
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
concurrency:
  group: ifaw-command-center-news
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Öffentliche Quellen abrufen
        run: |
          python command-center/scripts/collect.py
          python command-center/scripts/study_daily.py
      - name: Übersetzungsbedarf feststellen
        id: translations
        run: python command-center/scripts/translate_articles.py --check
      - name: Freies Offline-Übersetzungsmodell zwischenspeichern
        if: steps.translations.outputs.needed == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/argos-translate
            ~/.cache/argos-translate
          key: argos-en-de-model-v1
      - name: Argos Translate installieren (offline im Übersetzungsdurchlauf)
        if: steps.translations.outputs.needed == 'true'
        run: python -m pip install --disable-pip-version-check 'argostranslate>=1.10,<2'
      - name: Öffentliche Kurztexte ins Deutsche übersetzen
        if: steps.translations.outputs.needed == 'true'
        run: python command-center/scripts/translate_articles.py --limit 400
      - name: Datensatz aktualisieren ohne andere Änderungen zu überschreiben
        run: |
          if ! git diff --quiet -- command-center/data/articles.json command-center/data/daily_study.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add command-center/data/articles.json command-center/data/daily_study.json
            git commit -m 'chore: refresh public wildlife news metadata [skip ci]'
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main || { git rebase --abort; exit 1; }
              if git push origin HEAD:main; then break; fi
              if [ "$attempt" -eq 3 ]; then exit 1; fi
              sleep 2
            done
          fi
