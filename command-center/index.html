<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0d2536" />
  <meta name="description" content="Private Arbeitsoberfläche für öffentliches Tier- und Artenschutzmonitoring. Kein offizieller IFAW-Dienst." />
  <title>IFAW Command Center · Private Arbeitsoberfläche</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
  <script src="lib/analysis.js" defer></script>
  <script src="lib/graph.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div id="app" class="app-shell">
    <aside class="sidebar" aria-label="Hauptnavigation">
      <div class="brand"><div class="wordmark">ifaw<span>·</span></div><div class="brand-caption">COMMAND CENTER</div></div>
      <nav id="nav"></nav>
      <div class="side-bottom"><div class="side-kicker">ÖFFENTLICHE QUELLEN</div><div class="side-note">Privates, unabhängiges Recherche-Dashboard. Kein offizieller IFAW-Dienst.</div><button type="button" class="nav-settings" id="settingsSide">⚙ <span>Einstellungen</span></button></div>
    </aside>
    <div class="main-shell">
      <header class="topbar">
        <div class="mobile-brand">IFAW <span>COMMAND CENTER</span></div>
        <div class="top-search"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="10.8" cy="10.8" r="6.7"/><path d="m16 16 5 5"/></svg><input id="globalSearch" type="search" placeholder="Meldungen, Studien und Themen suchen ..." aria-label="Alle Inhalte durchsuchen" autocomplete="off" /></div>
        <div class="top-status" id="topStatus"><span class="status-dot muted"></span> Lade Quellen ...</div>
        <button id="refreshBtn" class="icon-btn" type="button" title="Daten neu laden" aria-label="Daten neu laden">↻</button>
        <div class="avatar" title="Private Arbeitsoberfläche">L</div>
      </header>
      <main id="main" tabindex="-1" aria-live="polite"><div class="loading">Lade Dashboard ...</div></main>
    </div>
  </div>
  <div id="toast" class="toast" aria-live="polite" role="status"></div>
</body>
</html>
