name: Command Center – Tests
on:
  pull_request:
    paths: ['command-center/**', '.github/workflows/ifaw-command-center-check.yml']
  push:
    branches: [main]
    paths: ['command-center/**', '.github/workflows/ifaw-command-center-check.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tests installieren
        run: python -m pip install pytest playwright
      - name: Chromium für Browser-Smoke-Test
        run: python -m playwright install --with-deps chromium
      - name: Code prüfen
        run: |
          cd command-center
          node --check app.js
          node --check lib/analysis.js
          node --check lib/graph.js
          node tests/test_analysis.cjs
          python -m pytest -q tests/test_collect.py tests/test_browser.py
