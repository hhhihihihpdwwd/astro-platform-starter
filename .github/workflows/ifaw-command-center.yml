name: Command Center – Quellen aktualisieren und veröffentlichen
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'command-center/**'
      - '!command-center/data/articles.json'
      - '.github/workflows/ifaw-command-center.yml'
  schedule:
    - cron: '13 */6 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: ifaw-command-center-pages
  cancel-in-progress: false
jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Öffentliche Quellen abrufen
        run: python command-center/scripts/collect.py
      - name: Nur öffentliche Artikelmetadaten versionieren
        run: |
          if ! git diff --quiet -- command-center/data/articles.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add command-center/data/articles.json
            git commit -m 'chore: refresh public news metadata [skip ci]'
            git push
          fi
      - name: Statische Seite vorbereiten
        run: |
          mkdir -p site/lib site/data
          cp command-center/index.html command-center/styles.css command-center/favicon.svg site/
          cp command-center/lib/*.js site/lib/
          cp command-center/data/articles.json site/data/
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
